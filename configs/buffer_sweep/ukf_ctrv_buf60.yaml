# Stage E: ban sao chi doi track_buffer de kiem tra floor effect.
# MOI tham so khac giu NGUYEN so voi ban goc.
# Cau hinh ByteTrack + UKF/CTRV cho Giai doan 4.
#
# QUAN TRONG: moi tham so GHEP CAP (track_high_thresh, track_low_thresh,
# new_track_thresh, track_buffer, match_thresh, fuse_score) duoc giu NGUYEN
# Y HET bytetrack.yaml mac dinh cua ultralytics. Dong duy nhat khac la
# `tracker_type` - tro toi CTRVByteTracker dang ky trong src/tracker_ctrv.py.
# Nho vay phep so sanh voi baseline chi khac dung MOT bien: motion model.
tracker_type: bytetrack_ukf_ctrv # (str) UKF + mo hinh CTRV (src/tracker_ctrv.py)
track_high_thresh: 0.25 # (float) First-stage match threshold; raise for cleaner tracks, lower to keep more
track_low_thresh: 0.1 # (float) Second-stage threshold for low-score matches; balances recovery vs drift
new_track_thresh: 0.25 # (float) Start a new track if no match ≥ this; higher reduces false tracks
track_buffer: 60 # (int) Frames to keep lost tracks alive; higher handles occlusion, increases ID switches risk
match_thresh: 0.8 # (float) Association similarity threshold (IoU/cost); tune with detector quality
fuse_score: True # (bool) Fuse detection score with motion/IoU for matching; stabilizes weak detections
