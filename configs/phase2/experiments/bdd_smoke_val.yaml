# SMOKE BDD100K-MOT tren 1-3 sequence val: XAC MINH DUONG CHAY, KHONG PHAI KET QUA THI NGHIEM.
#
# Ten rieng o CA BON cho (name / manifest / cache_id / split_name) de KHONG dung cham danh gia day du:
#   name       bdd_smoke_val   -> results/phase2/bdd_smoke_val/,
#                                 data/processed/trackers/BDD-val/p2-bdd_smoke_val-*
#   manifest   bdd100k_smoke_val.json  (KHONG phai bdd100k_final_val.json)
#   cache_id   yolov8n-coco_conf0.05_smoke_bdd  (KHONG phai ..._all_bdd cua danh gia day du)
#
# CHUA CHAY: da co anh val (200 video) nhung CHUA co nhan box_track_20 -> xem handoff/BDD100K_INVENTORY.md.
# `run_experiment.py` KHONG co tham so --videos; chon tap con BANG MANIFEST, khong bang dong lenh.
#
# Quy trinh (theo dung thu tu, khong duoc dao):
#   1. python src/check_bdd100k.py --part val --make-manifest          # phai exit 0, 0 loi schema
#   2. CHON 1-3 sequence va GHI RA results/phase2/manifests/bdd100k_smoke_val.json
#      TRUOC KHI XEM BAT KY METRIC NAO (tranh chon theo ket qua):
#        {"name": "bdd100k_smoke_val", "part": "val", "n_videos": 3, "videos": ["<v1>", "<v2>", "<v3>"],
#         "chon_luc": "<ISO timestamp>", "tieu_chi": "<vi du: 3 video dau theo thu tu bang chu cai>"}
#   3. python src/det_cache.py --dataset bdd100k --part val \
#        --manifest results/phase2/manifests/bdd100k_smoke_val.json \
#        --cache-id yolov8n-coco_conf0.05_smoke_bdd                     # CAN GPU
#   4. python src/run_experiment.py --exp configs/phase2/experiments/bdd_smoke_val.yaml
#
# Kiem sau khi chay (day la MUC DICH cua smoke, khong phai con so HOTA):
#   - nhan/frame/timestamp ghep dung: doi chieu n_frames trong summary.csv voi val_dt_stats.csv
#   - delta t vao du doan va vong doi: elapsed_mode steps, 1 buoc = 0.2 s @ 5 fps
#   - cache co weights_sha256 cua DUNG checkpoint da nap + doc strict thanh cong (guard review vong 3)
#   - anh xa lop va crowd-ignore: TrackEval dataset-class mot_crowd, class 13 conf 0
#   - frame khong co detection va khoang trong annotation KHONG bi suy dien thanh che hoan toan
#
# KHONG chon tham so/bo loc tu metric cua smoke. KHONG mo benchmark day du, tuning hay training detector.
name: bdd_smoke_val
dataset: bdd100k
split_name: BDD-val
part: val
manifest: results/phase2/manifests/bdd100k_smoke_val.json
cache_id: yolov8n-coco_conf0.05_smoke_bdd
classes: [1, 2, 3, 5, 7]          # COCO bicycle, car, motorcycle, bus, truck
max_det: 300
fps: 5
track_buffer_sec: 1.2             # = 6 buoc @ 5 fps, cung THOI GIAN giu track voi DETRAC 30 buoc @ 25 fps
elapsed_mode: steps               # delta t thuc tu timestamp -> n_steps
assoc_log: true
conditions:
  c25: {conf_min: 0.25}
trackers:                         # cau hinh DA KHOA tren DETRAC (configs/phase2/LOCK_moc2.md), khong doi
  - {name: cv,  yaml: bytetrack.yaml}
  - {name: ekf, yaml: configs/bytetrack_ekf_ctrv.yaml}
baseline: cv
pairs: [[ekf, cv]]
occlusion: {tag: bdd_smoke_val, fps: 5, context_s: 1.2, gaps: true, n_boot: 200}
