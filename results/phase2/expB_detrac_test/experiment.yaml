# MOC 2 - Thi nghiem B (THUAT TOAN dung chung bo loc) tren TAP TEST UA-DETRAC (40 video), c25, cau hinh KHOA
# (LOCK_moc2.md). Baseline = SORT nguyen ban (sort-orig1). Moi cap chi doi MOT yeu to (PHASE2_REPORT muc 7.2):
#   sort-orig1 -> sort-orig30 : bo dem (max_age 1 -> 30)
#   sort-orig30 -> sort-cv30  : bieu dien trang thai + nhieu (KF 7-D [u,v,s,r] -> KalmanFilterXYAH), cung vong doi SORT
#   sort-cv30 -> sort-ekf30   : motion model (CV -> EKF-CTRV), cung xyah, cung vong doi SORT
#   sort-orig1 -> sort-ekf1   : chi doi bo loc, giu vong doi nguyen ban (max_age 1)
#   sort-ekf30 -> bt-ekf      : vong doi/association (SORT -> ByteTrack)
name: expB_detrac_test
dataset: detrac
split_name: DETRAC-test
part: test
manifest: results/phase2/manifests/detrac_test.json
cache_id: yolov8n-coco_conf0.05_all
classes: [2, 3, 5, 7]
max_det: 300
fps: 25
elapsed_mode: skip
conditions:
  c25: {conf_min: 0.25}
trackers:
  - {name: sort-orig1,  yaml: configs/phase2/trackers/sort_orig_age1.yaml}
  - {name: sort-orig30, yaml: configs/phase2/trackers/sort_orig_age30.yaml}
  - {name: sort-cv30,   yaml: configs/phase2/trackers/sort_cv_age30.yaml}
  - {name: sort-ekf30,  yaml: configs/phase2/trackers/sort_ekf_ctrv_age30.yaml}
  - {name: sort-ekf1,   yaml: configs/phase2/trackers/sort_ekf_ctrv_age1.yaml}
  - {name: bt-ekf,      yaml: configs/bytetrack_ekf_ctrv.yaml}
baseline: sort-orig1
pairs:
  - [sort-orig30, sort-orig1, "chi doi bo dem max_age 1 -> 30 (SORT nguyen ban)"]
  - [sort-cv30, sort-orig30, "chi doi bieu dien trang thai KF 7-D -> XYAH, cung vong doi SORT, max_age 30"]
  - [sort-ekf30, sort-cv30, "chi doi motion model CV -> EKF-CTRV, cung XYAH, cung vong doi SORT"]
  - [sort-ekf1, sort-orig1, "chi doi bo loc, max_age 1"]
  - [bt-ekf, sort-ekf30, "chi doi vong doi/association SORT -> ByteTrack, cung EKF"]
occlusion: {part: test, context_s: 1.2, gaps: false, n_boot: 5000}
