# Nhom B - so sanh THUAT TOAN, tap DEV UA-DETRAC. Cung cache detection voi Nhom A, dieu kien A.
# BASELINE = sort-orig1 (SORT NGUYEN BAN). Moi cap so sanh chi doi MOT yeu to:
#   sort-orig1  -> sort-orig30 : bo dem (max_age 1 -> 30 = track_buffer cua ByteTrack)
#   sort-orig30 -> sort-cv30   : bieu dien trang thai + nhieu (KF 7-D [u,v,s,r] -> KalmanFilterXYAH cua ByteTrack)
#   sort-cv30   -> sort-ekf30  : motion model (CV -> EKF-CTRV), cung bieu dien xyah, cung vong doi SORT
#   sort-orig1  -> sort-ekf1   : chi doi bo loc, giu vong doi nguyen ban (max_age 1)
#   sort-ekf30  -> bt-ekf      : vong doi/association (SORT -> ByteTrack: 2 vong ghep, unconfirmed, fuse_score)
name: groupB_detrac_dev
dataset: detrac
split_name: DETRAC-all
part: train
manifest: results/phase2/manifests/detrac_dev.json
cache_id: yolov8n-coco_conf0.05_all
classes: [2, 3, 5, 7]
max_det: 300
fps: 25
elapsed_mode: skip
conditions:
  A: {conf_min: 0.25}
trackers:
  - {name: sort-orig1,  yaml: configs/phase2/trackers/sort_orig_age1.yaml}
  - {name: sort-orig30, yaml: configs/phase2/trackers/sort_orig_age30.yaml}
  - {name: sort-cv30,   yaml: configs/phase2/trackers/sort_cv_age30.yaml}
  - {name: sort-ekf30,  yaml: configs/phase2/trackers/sort_ekf_ctrv_age30.yaml}
  - {name: sort-ekf1,   yaml: configs/phase2/trackers/sort_ekf_ctrv_age1.yaml}
  - {name: bt-ekf,      yaml: configs/bytetrack_ekf_ctrv.yaml}
baseline: sort-orig1
occlusion: {part: train, context_s: 1.2, gaps: false, n_boot: 5000}
