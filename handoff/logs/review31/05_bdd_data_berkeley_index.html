<script type="text/javascript">
  // after loading the page, show the username
  $(window).on('load', function() {
    var cognitoUser = userPool.getCurrentUser();

    if (cognitoUser != null) {
      cognitoUser.getSession(function(err, session) {
        if (err) {
          console.error(err);
          $('#myDropdown').empty();
          $('#myDropdown').append('<a href=\'login.html\'>Login</a>');
          return;
        }
        cognitoUser.getUserAttributes(function(err, result) {
          if (err) {
            console.error(err);
            return;
          }
          for (i = 0; i < result.length; i++) {
            if (result[i].getName() == 'name') {
              $('#username').html(result[i].getValue());
            }
          }
          $('#myDropdown').append('<a href=\'portal.html\'>Portal</a>');
          $('#myDropdown').append('<a class=\'signout-button\'>Log out</a>');
          $('.signout-button').click(signout);
        });

      });
    } else {
      $('#myDropdown').empty();
      $('#myDropdown').append('<a href=\'login.html\'>Login</a>');
    }
  });

  /* When the user clicks on the button,
  toggle between hiding and showing the dropdown content */
  function dropdownClick() {
    if ($('#myDropdown').is(':hidden')) {
      $('#myDropdown').show();
    } else {
      $('#myDropdown').hide();
    }
  }
</script>
